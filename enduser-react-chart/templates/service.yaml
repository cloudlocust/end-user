apiVersion: v1
kind: Service
metadata:
    name: {{ include "enduser-react.fullname" . }}
    labels:
        app.kubernetes.io/name: {{ include "enduser-react.name" . }}
        helm.sh/chart: {{ include "enduser-react.chart" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
    selector:
        app.kubernetes.io/name: {{ include "enduser-react.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    ports:
        - port: {{ .Values.service.port }}
          targetPort: 80
    type: {{ .Values.service.type }}
